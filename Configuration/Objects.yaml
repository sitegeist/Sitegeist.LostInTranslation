Sitegeist\LostInTranslation\Domain\TranslationServiceInterface:
  className: 'Sitegeist\LostInTranslation\Infrastructure\DeepL\DeepLTranslationService'

Sitegeist\LostInTranslation\Infrastructure\DeepL\DeepLCacheService:
  properties:
    translationCache:
      object:
        factoryObjectName: Neos\Flow\Cache\CacheManager
        factoryMethodName: getCache
        arguments:
          1:
            value: Sitegeist_LostInTranslation_TranslationCache

Sitegeist\LostInTranslation\Infrastructure\DeepL\DeepLCustomAuthenticationKeyService:
  properties:
    apiKeyCache:
      object:
        factoryObjectName: Neos\Flow\Cache\CacheManager
        factoryMethodName: getCache
        arguments:
          1:
            value: Sitegeist_LostInTranslation_ApiKeyCache

Sitegeist\LostInTranslation\ContentRepository\StaleTranslationProjection\StaleTranslationProjectionFactory:
  arguments:
    1:
      object:
        factoryObjectName: 'Doctrine\ORM\EntityManagerInterface'
        factoryMethodName: 'getConnection'
    2:
      setting: Sitegeist.LostInTranslation.nodeTranslation.languageDimensionName
