# Config Used in Synchronization Feature file
Sitegeist:
  LostInTranslation:
    nodeTranslation:
      synchronization:
        # Document scope: mirror documents AND content on publish to `live`. Exercised by the publish-on-live scenarios
        # (en → es is auto-synced; de has no auto rule).
        - sourceWorkspaceName: live
          sourceDimension: en
          targetWorkspaceName: live
          targetDimension: es
          scope: Document
        # `ask` mode: publishing to `live` must NOT auto-translate into `de`; the stale rows survive until a manual
        # synchronization runs (the "ask mode" scenario). `de` was already left untouched by the auto scenarios, so
        # adding this rule does not change their expectations — it only adds the manual-sync path under test.
        - sourceWorkspaceName: live
          sourceDimension: en
          targetWorkspaceName: live
          targetDimension: de
          scope: Document
          mode: ask
        # Content scope: only fill in content below documents that already exist in the target dimension; never create
        # documents automatically. Fires on publish to `content-review`.
        - sourceWorkspaceName: live
          sourceDimension: en
          targetWorkspaceName: content-review
          targetDimension: es
          scope: Content

Neos:
  Flow:
    persistence:
      backendOptions:
        dbname: 'flow_functional_testing'
    i18n:
      defaultLocale: de
  ContentRepository:
    contentDimensions:
      language:
        label: Languages
        icon: language
        # The default dimension that is applied when creating nodes without specifying a dimension
        default: de
        # The default preset to use if no URI segment was given when resolving languages in the router
        defaultPreset: de
        presets:
          de:
            label: Deutsch
            values:
              - de
            uriSegment: ''
          en:
            label: English
            values:
              - en
              - de
            uriSegment: 'en'
            options:
              translationStrategy: 'sync'
          it:
            label: Italiano
            values:
              - it
              - de
            uriSegment: 'it'
            options:
              translationStrategy: 'once'
