# Config Used in Synchronization Feature file
Sitegeist:
  LostInTranslation:
    nodeTranslation:
      synchronization:
        # Document scope: mirror documents AND content on publish to `live`. Exercised by the
        # publish-on-live scenarios (en → es is auto-synced; de has no rule).
        - sourceWorkspaceName: live
          sourceDimension: en
          targetWorkspaceName: live
          targetDimension: es
          scope: Document
        # Content scope: only fill in content below documents that already exist in the target
        # dimension; never create documents automatically. Fires on publish to `content-review`.
        - sourceWorkspaceName: content-review
          sourceDimension: en
          targetWorkspaceName: content-review
          targetDimension: es
          scope: Content

Neos:
  Flow:
    persistence:
      backendOptions:
        dbname: 'flow_functional_testing'
    i18n:
      defaultLocale: de
  ContentRepository:
    contentDimensions:
      language:
        label: Languages
        icon: language
        # The default dimension that is applied when creating nodes without specifying a dimension
        default: de
        # The default preset to use if no URI segment was given when resolving languages in the router
        defaultPreset: de
        presets:
          de:
            label: Deutsch
            values:
              - de
            uriSegment: ''
          en:
            label: English
            values:
              - en
              - de
            uriSegment: 'en'
            options:
              translationStrategy: 'sync'
          it:
            label: Italiano
            values:
              - it
              - de
            uriSegment: 'it'
            options:
              translationStrategy: 'once'
