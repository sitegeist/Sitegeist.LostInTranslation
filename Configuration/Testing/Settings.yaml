# Config Used in Synchronization Feature file
Sitegeist:
  LostInTranslation:
    nodeTranslation:
      synchronization:
        # Document scope: mirror documents AND content on publish to `live`. Exercised by the publish-on-live scenarios
        # (en → es is auto-synced; de has no auto rule). `remove-target` so source-language deletions are mirrored into
        # es on publish (the auto-path removal scenarios).
        - sourceWorkspaceName: live
          sourceDimension: en
          targetWorkspaceName: live
          targetDimension: es
          scope: Document
          onSourceRemoval: remove-target
          onSourceTagging: sync-to-target
        # `ask` mode: publishing to `live` must NOT auto-translate into `de`; the stale rows survive until a manual
        # synchronization runs (the "ask mode" scenario). `de` was already left untouched by the auto scenarios, so
        # adding this rule does not change their expectations — it only adds the manual-sync path under test.
        # `remove-target` here is same-workspace (live → live), so it has NO force-rebase that would drop an orphaned
        # variant — letting the "`ask` defers the removal mirror to the manual sync" scenario observe the deferral.
        - sourceWorkspaceName: live
          sourceDimension: en
          targetWorkspaceName: live
          targetDimension: de
          scope: Document
          mode: ask
          onSourceRemoval: remove-target
        # Content scope: only fill in content below documents that already exist in the target dimension; never create
        # documents automatically. Fires on publish to `content-review`. Kept at the default `keep-target`; the
        # Content-scope removal GATE is exercised via the manual diff path (synchronize ... removing orphans).
        - sourceWorkspaceName: live
          sourceDimension: en
          targetWorkspaceName: content-review
          targetDimension: es
          scope: Content
        # Cross-workspace `ask` rule: publishing to `live` force-rebases the `de-review` workspace onto `live` (so its
        # status reflects what needs translating) but defers the actual translation to a manual sync. Only fires when
        # `de-review` exists. Exercises the rebase-on-publish-for-ask path. `remove-target` to verify an `ask` rule does
        # NOT remove on publish — the deletion is reconciled by the deferred manual sync instead.
        - sourceWorkspaceName: live
          sourceDimension: en
          targetWorkspaceName: de-review
          targetDimension: de
          scope: Document
          mode: ask
          onSourceRemoval: remove-target

Neos:
  Flow:
    persistence:
      backendOptions:
        dbname: 'flow_functional_testing'
    i18n:
      defaultLocale: de
  ContentRepository:
    contentDimensions:
      language:
        label: Languages
        icon: language
        # The default dimension that is applied when creating nodes without specifying a dimension
        default: de
        # The default preset to use if no URI segment was given when resolving languages in the router
        defaultPreset: de
        presets:
          de:
            label: Deutsch
            values:
              - de
            uriSegment: ''
          en:
            label: English
            values:
              - en
              - de
            uriSegment: 'en'
          it:
            label: Italiano
            values:
              - it
              - de
            uriSegment: 'it'
