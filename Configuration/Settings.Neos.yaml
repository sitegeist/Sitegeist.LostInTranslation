Neos:
  Fusion:
    defaultContext:
      'Sitegeist.LostInTranslation': 'Sitegeist\LostInTranslation\Eel\TranslationHelper'
  Neos:
    modules:
      management:
        submodules:
          sitegeist_lostintranslation:
            label: 'Lost In Translation'
            description: 'DeepL based Translations for Neos'
            icon: 'icon-language'
            controller: 'Sitegeist\LostInTranslation\Controller\LostInTranslationModuleController'
            privilegeTarget: 'Sitegeist.LostInTranslation:AccessBackendModule'

  ContentRepositoryRegistry:
    presets:
      'default':
        commandHooks:
          'Sitegeist.LostInTranslation:TranslationCommandHook':
            factoryObjectName: Sitegeist\LostInTranslation\ContentRepository\CommandHook\TranslationCommandHookFactory
          # Order matters: SynchronizationCommandHook must come AFTER TranslationCommandHook. TranslationCommandHook
          # unconditionally resets the AI runtime state at the top of every `onAfterHandle`; the sync hook sets the
          # state again before returning its cascade commands, so if it ran first that initial set would be wiped.
          # For follow-up commands within the cascade the sync hook re-sets the state in `onBeforeHandle` (see its
          # docblock for the full ordering rationale).
          'Sitegeist.LostInTranslation:SynchronizationCommandHook':
            factoryObjectName: Sitegeist\LostInTranslation\ContentRepository\CommandHook\SynchronizationCommandHookFactory
        # Activate for content governance mode:
        #authProvider:
        #  factoryObjectName: Sitegeist\LostInTranslation\ContentRepository\AuthProvider\AIAwareContentRepositoryAuthProviderFactory

        projections:
          'Sitegeist.LostInTranslation:StaleTranslations':
            factoryObjectName: Sitegeist\LostInTranslation\ContentRepository\StaleTranslationProjection\StaleTranslationProjectionFactory
