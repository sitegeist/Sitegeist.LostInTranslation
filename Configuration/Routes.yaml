-
  name:  'LostInTranslation - Translation Metadata'
  uriPattern: 'lostintranslation/retranslation/getmetadata'
  defaults:
    '@package': 'Sitegeist.LostInTranslation'
    '@controller': 'Retranslation'
    '@action': 'getTranslationMetadata'
  httpMethods: ['GET']

-
  name:  'LostInTranslation - Retranslation'
  uriPattern: 'lostintranslation/retranslation/retranslatenode'
  defaults:
    '@package': 'Sitegeist.LostInTranslation'
    '@controller': 'Retranslation'
    '@action': 'retranslateNode'
  httpMethods: ['POST']

-
  name:  'LostInTranslation - Synchronization Pending'
  uriPattern: 'lostintranslation/synchronization/pending'
  defaults:
    '@package': 'Sitegeist.LostInTranslation'
    '@controller': 'WorkspaceSynchronization'
    '@action': 'pending'
  httpMethods: ['GET']

-
  name:  'LostInTranslation - Synchronization Synchronize'
  uriPattern: 'lostintranslation/synchronization/synchronize'
  defaults:
    '@package': 'Sitegeist.LostInTranslation'
    '@controller': 'WorkspaceSynchronization'
    '@action': 'synchronize'
  httpMethods: ['POST']
