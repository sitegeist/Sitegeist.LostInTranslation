'Neos.Neos:Node':
  options:
    automaticTranslation: true
  ui:
    inspector:
      groups:
        lostInTranslation:
          label: 'Sitegeist.LostInTranslation:NodeTypes.Node:groups.lostInTranslation'
          icon: language
          tab: meta
      views:
        retranslate:
          label: ''
          group: lostInTranslation
          position: end
          view: 'Sitegeist.LostInTranslation/Inspector/Views/RetranslateNodeView'

'Neos.Neos:Document':
  properties:
    # uriPathSegment is not auto-translated by default; when an integrator opts it in
    # (options.automaticTranslation: true) the post-processor coerces the translation back into a valid slug.
    uriPathSegment:
      options:
        translationPostProcessor: 'Sitegeist\LostInTranslation\Domain\PostProcessor\UriPathSegmentPostProcessor'
    title:
      options:
        automaticTranslation: true
    titleOverride:
      options:
        automaticTranslation: true
    metaDescription:
      options:
        automaticTranslation: true
    metaKeywords:
      options:
        automaticTranslation: true
  ui:
    inspector:
      groups:
        lostInTranslation:
          label: 'Sitegeist.LostInTranslation:NodeTypes.Document:groups.lostInTranslation'
          icon: language
          tab: meta
      views:
        retranslate:
          label: ''
          group: lostInTranslation
          position: end
          view: 'Sitegeist.LostInTranslation/Inspector/Views/RetranslateDocumentView'
