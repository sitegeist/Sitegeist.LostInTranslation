# Fully containerized Behat / E2E runner.
#
# `make e2e` (from the package root) builds the PHP image, starts MariaDB and runs
# the suite. Only Docker is required on the host — no PHP, Composer or database.
#
# Override defaults via env, e.g.:
#   PHP_VERSION=8.2 NEOS_VERSION=9.0 make e2e
name: lostintranslation-e2e

services:
  database:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: flow_functional_testing
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  behat:
    build:
      context: .
      args:
        PHP_VERSION: ${PHP_VERSION:-8.3}
    depends_on:
      database:
        condition: service_healthy
    environment:
      NEOS_VERSION: ${NEOS_VERSION:-9.1}
      DB_HOST: database
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: flow_functional_testing
    volumes:
      # The package source, symlinked into the distribution for live editing.
      - ../../..:/package
      # Mask the host's local Neos-distribution overlay (all gitignored) so it
      # does not leak into the container. In particular the host's
      # Packages/Application/Sitegeist.LostInTranslation '-> ../../..' symlink
      # would make Flow's package scanner recurse infinitely.
      - /package/Packages
      - /package/bin
      - /package/Data
      - /package/Web
      - /package/Build
      - /package/node_modules
      # The bootstrapped distribution, cached across runs.
      - dist:/dist

volumes:
  dist:
